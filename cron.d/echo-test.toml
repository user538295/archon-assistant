# Example cron job — runs every minute and echoes a message.
# The filename (without .toml) becomes the job name shown in /jobs.
# Copy and rename this file to define your own jobs.

schedule = "* * * * *"         # every minute — change to your desired schedule
notify_user_id = 154643621     # Telegram user ID to notify on completion
timeout_seconds = 10           # per-step timeout in seconds
enabled = false                # set to true to activate this job

[[pipeline]]
tool = "echo hello from cron"
