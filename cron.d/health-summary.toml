# Daily health summary — runs a script then asks Claude to summarize the output.
# Disabled by default; set enabled = true to activate.

schedule = "0 8 * * *"         # daily at 08:00
notify_user_id = 154643621     # Telegram user ID to notify on completion
timeout_seconds = 30           # per-step timeout in seconds
enabled = false                # set to true to activate this job

[[pipeline]]
tool = "scripts/health_check.sh"

[[pipeline]]
prompt = "Summarize in one line: {input}"
