[project]
name = "archon"
version = "0.1.0"
description = "Local daemon bridging Telegram with Claude Code via the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0",
    "aiohttp>=3.9",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1.46",
    "croniter>=6.0.0",
    "edge-tts>=7.2.7",
    "httpx>=0.25",
    "mistune>=3.2.0",
    "python-dotenv>=1.0",
    "tomlkit>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "tomli-w>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=archon --cov-report=term-missing --cov-fail-under=85 -m 'not live'"
markers = [
    "live: tests that use real external resources (processes, files, network); excluded from default runs",
    "requires_telegram: live tests that need TELEGRAM_BOT_TOKEN and TELEGRAM_LIVE_CHAT_ID in env",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["archon*"]

[tool.mypy]
python_version = "3.12"
strict = true

[project.scripts]
archon = "archon.cli.main:main"
