# Daily health summary — runs a script then asks Claude to summarize the output.
# Requires scripts/health_check.sh installed to ~/.archon/scripts/ by the installer.
# Disabled by default; set enabled = true to activate.

cron = "0 6 * * *"              # daily at 06:00 Europe/Berlin time
timezone = "Europe/Berlin"      # IANA timezone name for the schedule above
timeout_seconds = 30            # per-step timeout in seconds
enabled = false                 # set to true to activate this job

[pipeline]
health_check_tool = "scripts/health_check.sh"
summarize_prompt = "Summarize in one line with useful data: {health_check_tool}"
