# Example scheduled job — runs every minute and echoes a message.
# The directory name becomes the job name shown in /scheduled.
# Copy and rename this directory to define your own jobs.

cron = "* * * * *"              # every minute — change to your desired schedule
timezone = "Europe/Berlin"      # IANA timezone name for the schedule above
timeout_seconds = 10           # per-step timeout in seconds
enabled = false                # set to true to activate this job

[pipeline]
test_echo_tool = "echo hello from scheduler"
